# Projeto compose "borda": a porta de entrada da VPS e o banco compartilhado.
# Sobe uma vez por VPS, com VPS_createNewProjectV1(project_name="borda").
#
# Ele NAO declara rede nenhuma de proposito. O Docker Compose cria a rede padrao
# do projeto, chamada "<projeto>_default" - ou seja, "borda_default". E essa a rede
# compartilhada: o compose de cada app entra nela como rede externa.
# Por isso nao existe "docker network create" em lugar nenhum da receita.
services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_INGRESS_NETWORKS: borda_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
      - caddy_config:/config

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=512M
      - --max-connections=200
      - --skip-name-resolve
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
